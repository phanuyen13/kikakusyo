<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ambassador Platform - Workflow with Review System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-4 md:p-8 min-h-screen flex items-center justify-center">
    <div class="max-w-5xl w-full mx-auto space-y-6">
        <!-- Header -->
        <header class="border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-400 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> AIインフルエンサー 統合管理システム
                </h1>
                <p class="text-xs text-slate-400 mt-1">アバターリアルタイムレビュー & SNS自動配信ワークフロー</p>
            </div>
            <span class="text-xs bg-blue-950 text-blue-400 border border-blue-800 px-3 py-1 rounded-full font-mono">v2.4 Ready</span>
        </header>

        <!-- Step Navigation Bar -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2 bg-slate-900 p-2 rounded-xl border border-slate-800 text-xs text-center font-medium">
            <div id="step-btn-1" class="py-2.5 rounded-lg bg-blue-600 text-white font-bold cursor-pointer transition" onclick="goToStep(1)">1. 基本設定</div>
            <div id="step-btn-2" class="py-2.5 rounded-lg text-slate-400 cursor-pointer transition" onclick="goToStep(2)">2. APIキー設定</div>
            <div id="step-btn-3" class="py-2.5 rounded-lg text-slate-400 cursor-pointer transition" onclick="goToStep(3)">3. アバター選択</div>
            <div id="step-btn-4" class="py-2.5 rounded-lg text-slate-400 cursor-pointer transition flex items-center justify-center gap-1" onclick="goToStep(4)">
                <span>4. レビュー</span>
                <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
            </div>
            <div id="step-btn-5" class="py-2.5 rounded-lg text-slate-400 cursor-pointer transition" onclick="goToStep(5)">5. 動画生成/検閲</div>
            <div id="step-btn-6" class="py-2.5 rounded-lg text-slate-400 cursor-pointer transition" onclick="goToStep(6)">6. SNS自動投稿</div>
        </div>

        <!-- Simulation Container -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 min-h-[480px] flex flex-col justify-between shadow-2xl relative">
            <div id="step-content">
                <!-- Content is injected dynamically by JavaScript -->
            </div>

            <!-- Navigation Controls -->
            <div class="flex justify-between items-center border-t border-slate-800 pt-4 mt-6">
                <button id="prev-btn" onclick="prevStep()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-300 transition disabled:opacity-30 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> 前のステップ
                </button>
                <div class="text-xs font-mono text-slate-500" id="step-indicator">Step 1 / 6</div>
                <button id="next-btn" onclick="nextStep()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-semibold text-white transition shadow-lg shadow-blue-900/30">
                    次のステップ <i class="fa-solid fa-arrow-right ml-1.5"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        let previewState = {
            expression: 'smile',
            bg: 'office',
            isPlaying: false,
            isApproved: false,
            testText: '皆様こんにちは。我が社の最新AIソリューションをご案内いたします。'
        };

        function renderStep() {
            const container = document.getElementById('step-content');
            
            if (currentStep === 1) {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-blue-600/20 text-blue-400 flex items-center justify-center font-bold text-lg"><i class="fa-solid fa-building"></i></div>
                            <div>
                                <h2 class="text-base font-bold text-white">1. アカウント登録 & ブランド基本設定</h2>
                                <p class="text-xs text-slate-400">企業プロファイルおよびコンテンツ運用ポリシーを定義します。</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4">
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800/80">
                                <label class="text-xs text-slate-400 mb-1 block">組織名 / 企業名</label>
                                <input type="text" value="株式会社AIソリューションズ" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            </div>
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800/80">
                                <label class="text-xs text-slate-400 mb-1 block">運用担当部門</label>
                                <input type="text" value="広報・デジタルマーケティング部" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentStep === 2) {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-purple-600/20 text-purple-400 flex items-center justify-center font-bold text-lg"><i class="fa-solid fa-key"></i></div>
                            <div>
                                <h2 class="text-base font-bold text-white">2. SNS API認証キー設定</h2>
                                <p class="text-xs text-slate-400">自動投稿を実行する各種SNSプラットフォームのAPIキーを連携します。</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-xs text-slate-200 flex items-center gap-2"><i class="fa-brands fa-tiktok text-pink-500"></i> TikTok API</span>
                                    <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded">接続済み</span>
                                </div>
                                <p class="text-[11px] text-slate-500">Token: ********************</p>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-xs text-slate-200 flex items-center gap-2"><i class="fa-brands fa-youtube text-red-500"></i> YouTube API</span>
                                    <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded">接続済み</span>
                                </div>
                                <p class="text-[11px] text-slate-500">OAuth 2.0 Authenticated</p>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-xs text-slate-200 flex items-center gap-2"><i class="fa-brands fa-instagram text-purple-500"></i> Instagram API</span>
                                    <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded">接続済み</span>
                                </div>
                                <p class="text-[11px] text-slate-500">Graph API Connected</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentStep === 3) {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-blue-600/20 text-blue-400 flex items-center justify-center font-bold text-lg"><i class="fa-solid fa-robot"></i></div>
                            <div>
                                <h2 class="text-base font-bold text-white">3. AIアバター & ボイスモデル選択</h2>
                                <p class="text-xs text-slate-400">配信コンテンツで使用するAIアバターと音声合成エンジンを選択します。</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                            <div class="bg-slate-950 border-2 border-blue-500 p-4 rounded-xl text-center space-y-2 relative">
                                <div class="w-16 h-16 bg-blue-900/50 rounded-full mx-auto flex items-center justify-center text-blue-400">
                                    <i class="fa-solid fa-user-tie text-2xl"></i>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-white">広報担当 A (Official)</p>
                                    <p class="text-[10px] text-slate-400">日本語 / 女性アナウンサー風</p>
                                </div>
                                <span class="inline-block text-[10px] bg-blue-900 text-blue-300 px-2 py-0.5 rounded font-semibold">選択中</span>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center space-y-2 opacity-50 cursor-not-allowed">
                                <div class="w-16 h-16 bg-slate-800 rounded-full mx-auto flex items-center justify-center text-slate-400">
                                    <i class="fa-solid fa-user text-2xl"></i>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-white">クリエイター B</p>
                                    <p class="text-[10px] text-slate-400">カジュアル / 男性ボイス</p>
                                </div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center space-y-2 opacity-50 cursor-not-allowed">
                                <div class="w-16 h-16 bg-slate-800 rounded-full mx-auto flex items-center justify-center text-slate-400">
                                    <i class="fa-solid fa-wand-magic-sparkles text-2xl"></i>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-white">カスタム3Dモデル</p>
                                    <p class="text-[10px] text-slate-400">VRMファイルインポート</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentStep === 4) {
                // STEP 4: REVIEW & PREVIEW MODULE
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold text-lg"><i class="fa-solid fa-sliders"></i></div>
                                <div>
                                    <h2 class="text-base font-bold text-white">4. アバター リアルタイム プレビュー & レビュー確認</h2>
                                    <p class="text-xs text-slate-400">表情、音声シンクロ、背景設定の動作を確認し、レビュー承認を行います。</p>
                                </div>
                            </div>
                            <span id="review-approval-status" class="text-xs font-bold px-3 py-1 rounded-full ${previewState.isApproved ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">
                                ${previewState.isApproved ? '<i class="fa-solid fa-check"></i> レビュー承認済み' : '<i class="fa-solid fa-clock"></i> 未承認 (レビュー中)'}
                            </span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 pt-2">
                            <!-- Visual Player Frame -->
                            <div class="md:col-span-5 bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col items-center justify-between min-h-[240px] relative overflow-hidden">
                                <div class="absolute inset-0 opacity-15 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=400&q=80');"></div>
                                
                                <div class="relative z-10 w-full flex justify-between items-center text-[10px] text-slate-400 border-b border-slate-800/80 pb-2">
                                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-circle text-red-500 text-[8px] animate-pulse"></i> LIVE SIMULATOR</span>
                                    <span class="font-mono">1080p | 60fps</span>
                                </div>

                                <!-- Avatar Visual Representation -->
                                <div class="relative z-10 my-3 text-center">
                                    <div class="w-20 h-20 rounded-full bg-indigo-900/60 border-2 border-indigo-400 mx-auto flex items-center justify-center text-indigo-300 relative shadow-lg shadow-indigo-950">
                                        <i class="fa-solid fa-user-tie text-3xl"></i>
                                        ${previewState.isPlaying ? '<span class="absolute -bottom-1 -right-1 bg-emerald-500 w-4 h-4 rounded-full border-2 border-slate-950 animate-ping"></span>' : ''}
                                    </div>
                                    <p class="text-xs font-bold text-white mt-2">広報担当 A (Official)</p>
                                    <p class="text-[10px] text-indigo-300 font-mono mt-0.5">
                                        [表情: ${previewState.expression === 'smile' ? '笑顔 (Smile)' : previewState.expression === 'serious' ? '真剣 (Serious)' : '挨拶 (Greeting)'}]
                                    </p>
                                </div>

                                <!-- Audio Wave & Playback Simulation -->
                                <div class="relative z-10 w-full bg-slate-900/90 rounded-lg p-2 border border-slate-800 flex items-center justify-between">
                                    <button onclick="toggleVoiceTest()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded transition flex items-center gap-1.5">
                                        <i class="fa-solid ${previewState.isPlaying ? 'fa-square' : 'fa-play'}"></i> ${previewState.isPlaying ? '停止' : '音声テスト再生'}
                                    </button>
                                    <div class="flex gap-1 items-end h-4 px-2">
                                        <div class="w-1 bg-indigo-400 transition-all ${previewState.isPlaying ? 'h-4 animate-bounce' : 'h-1'}"></div>
                                        <div class="w-1 bg-indigo-400 transition-all ${previewState.isPlaying ? 'h-3 animate-bounce delay-75' : 'h-1'}"></div>
                                        <div class="w-1 bg-indigo-400 transition-all ${previewState.isPlaying ? 'h-4 animate-bounce delay-150' : 'h-1'}"></div>
                                        <div class="w-1 bg-indigo-400 transition-all ${previewState.isPlaying ? 'h-2 animate-bounce' : 'h-1'}"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Controls & Parameter Review -->
                            <div class="md:col-span-7 space-y-3">
                                <div>
                                    <label class="text-xs font-bold text-slate-300 mb-1 block">1. テスト音声スクリプトの入力</label>
                                    <input type="text" id="test-script-input" value="${previewState.testText}" onchange="updateTestText(this.value)" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                                </div>

                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-xs font-bold text-slate-300 mb-1 block">2. 表情プリセット</label>
                                        <select onchange="changeExpression(this.value)" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                                            <option value="smile" ${previewState.expression === 'smile' ? 'selected' : ''}>笑顔 (Standard Smile)</option>
                                            <option value="serious" ${previewState.expression === 'serious' ? 'selected' : ''}>フォーマル・真剣 (Formal)</option>
                                            <option value="greeting" ${previewState.expression === 'greeting' ? 'selected' : ''}>明るい挨拶 (Energetic)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-xs font-bold text-slate-300 mb-1 block">3. 背景環境</label>
                                        <select class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                                            <option value="office">モダンオフィス (Office)</option>
                                            <option value="studio">撮影スタジオ (Studio Light)</option>
                                            <option value="transparent">透過背景 (Green Screen)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="pt-2">
                                    <button onclick="approveReview()" class="w-full py-3 ${previewState.isApproved ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-blue-600 hover:bg-blue-500'} text-white rounded-lg font-bold text-xs transition shadow-lg flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-circle-check"></i> ${previewState.isApproved ? 'アバター設定 承認完了 (次のステップへ進めます)' : 'このアバター設定をレビュー承認する'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentStep === 5) {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-emerald-600/20 text-emerald-400 flex items-center justify-center font-bold text-lg"><i class="fa-solid fa-shield-halved"></i></div>
                            <div>
                                <h2 class="text-base font-bold text-white">5. 動画生成 & Brand Safety Guard 検閲</h2>
                                <p class="text-xs text-slate-400">承認されたアバター設定に基づき、フル動画のレンダリングとガバナンスチェックを実行します。</p>
                            </div>
                        </div>
                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-400">レビュー済みアバター動画合成:</span>
                                <span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle-check"></i> 合成完了 (1080p / 60fps)</span>
                            </div>
                            <div class="bg-emerald-950/40 border border-emerald-800 p-3 rounded-lg text-xs text-emerald-300 flex items-center gap-3">
                                <i class="fa-solid fa-shield-check text-xl text-emerald-400"></i>
                                <div>
                                    <p class="font-bold">Brand Safety Guard 判定結果: 合格 (Passed)</p>
                                    <p class="text-[10px] text-emerald-400 mt-0.5">不適切発言、不快表現、および著作権侵害のリスクは検出されませんでした。</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentStep === 6) {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-pink-600/20 text-pink-400 flex items-center justify-center font-bold text-lg"><i class="fa-solid fa-paper-plane"></i></div>
                            <div>
                                <h2 class="text-base font-bold text-white">6. SNSマルチプラットフォーム自動投稿</h2>
                                <p class="text-xs text-slate-400">認証済みAPIキーを使用して、検閲済み動画を各SNSへ一 me? 配信します。</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-2">
                            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center space-y-2">
                                <i class="fa-brands fa-tiktok text-2xl text-pink-500"></i>
                                <p class="text-xs font-bold text-white">TikTok</p>
                                <span class="inline-block text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-2.5 py-0.5 rounded-full font-bold">API投稿完了</span>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center space-y-2">
                                <i class="fa-brands fa-youtube text-2xl text-red-500"></i>
                                <p class="text-xs font-bold text-white">YouTube Shorts</p>
                                <span class="inline-block text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-2.5 py-0.5 rounded-full font-bold">API投稿完了</span>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-center space-y-2">
                                <i class="fa-brands fa-instagram text-2xl text-purple-500"></i>
                                <p class="text-xs font-bold text-white">Instagram Reels</p>
                                <span class="inline-block text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-2.5 py-0.5 rounded-full font-bold">API投稿完了</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            document.getElementById('step-indicator').innerText = `Step ${currentStep} / 6`;
            document.getElementById('prev-btn').disabled = currentStep === 1;
            document.getElementById('next-btn').innerHTML = currentStep === 6 ? '最初に戻る <i class="fa-solid fa-rotate-left ml-1"></i>' : '次のステップ <i class="fa-solid fa-arrow-right ml-1"></i>';

            for (let i = 1; i <= 6; i++) {
                const btn = document.getElementById(`step-btn-${i}`);
                if (i === currentStep) {
                    btn.className = "py-2.5 rounded-lg bg-blue-600 text-white font-bold cursor-pointer transition shadow-md shadow-blue-900/40";
                } else {
                    btn.className = "py-2.5 rounded-lg text-slate-400 cursor-pointer transition hover:bg-slate-800 hover:text-slate-200";
                }
            }
        }

        function toggleVoiceTest() {
            previewState.isPlaying = !previewState.isPlaying;
            renderStep();
        }

        function changeExpression(val) {
            previewState.expression = val;
            renderStep();
        }

        function updateTestText(val) {
            previewState.testText = val;
        }

        function approveReview() {
            previewState.isApproved = true;
            renderStep();
        }

        function nextStep() {
            if (currentStep < 6) currentStep++;
            else currentStep = 1;
            renderStep();
        }

        function prevStep() {
            if (currentStep > 1) currentStep--;
            renderStep();
        }

        function goToStep(s) {
            currentStep = s;
            renderStep();
        }

        renderStep();
    </script>
</body>
</html>
